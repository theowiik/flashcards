<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flashcards</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <h1 class="brand">Flashcards</h1>
    <div class="deck-picker">
      <label for="deck-select" class="sr-only">Deck</label>
      <select id="deck-select"></select>
      <button id="new-deck" class="btn ghost" title="New deck">+ Deck</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-view="study">Study</button>
    <button role="tab" data-view="connect">Connect</button>
    <button role="tab" data-view="edit">Edit cards</button>
  </nav>

  <main id="view"></main>

  <template id="tpl-empty">
    <div class="empty">
      <p>This deck has no cards yet.</p>
      <button class="btn primary" data-goto="edit">Add cards</button>
    </div>
  </template>
</body>
</html>
